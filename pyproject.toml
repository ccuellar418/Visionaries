[project]
name = "visionaries"
version = "0.1.0"
description = "MediaPipe gesture and hand tracking project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imageio>=2.38.2",
    "imageio-ffmpeg>=0.8.1",
    "mediapipe==0.10.14",
    "opencv-contrib-python>=4.11,<5",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
